
name: Reyette RDP Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    name: Start Reyette Windows RDP
    runs-on: windows-2022
    timeout-minutes: 350
    environment: reyette_rdp

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. VALIDATE SECRETS
      # ==========================================
      - name: Validate Configuration
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          if ($env:RDP_PASSWORD.Length -lt 12) {
              throw "RDP password must contain at least 12 characters."
          }

          Write-Host "Configuration validated."

      # ==========================================
      # 3. CONFIGURE WINDOWS RDP
      # ==========================================
      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Require Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Require TLS security layer
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 2

          # High encryption level
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "MinEncryptionLevel" `
            -Value 3

          # Create or update RDP user
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              New-LocalUser `
                -Name "RDP" `
                -Password $password `
                -Description "Reyette Remote Desktop Administrator"
          } else {
              Set-LocalUser -Name "RDP" -Password $password
          }

          # Add RDP user to Remote Desktop Users
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          $rdpMember = Get-LocalGroupMember -Group $rdpGroup |
              Where-Object { $_.Name -match "\\RDP$" }

          if ($null -eq $rdpMember) {
              Add-LocalGroupMember -Group $rdpGroup -Member "RDP"
          }

          # Add RDP user to Administrators
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          $adminMember = Get-LocalGroupMember -Group $adminGroup |
              Where-Object { $_.Name -match "\\RDP$" }

          if ($null -eq $adminMember) {
              Add-LocalGroupMember -Group $adminGroup -Member "RDP"
          }

          # Enable Remote Desktop service
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP user configured as Administrator."

      # ==========================================
      # 3.1. CONFIGURE HARDWARE GPU RENDERING
      # ==========================================
      - name: Configure Hardware GPU Rendering
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring hardware graphics..."

          $registryPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          # Create registry path
          if (-not (Test-Path $registryPath)) {
              New-Item -Path $registryPath -Force | Out-Null
          }

          # Prefer hardware graphics adapters
          New-ItemProperty `
            -Path $registryPath `
            -Name "bEnumerateHWBeforeSW" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          # Enable WDDM graphics driver
          New-ItemProperty `
            -Path $registryPath `
            -Name "fEnableWddmDriver" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          # Prefer H.264 hardware encoding
          New-ItemProperty `
            -Path $registryPath `
            -Name "AVCHardwareEncodePreferred" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          # Prefer AVC444 graphics mode
          New-ItemProperty `
            -Path $registryPath `
            -Name "AVC444ModePreferred" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          Write-Host "[SUCCESS] Hardware GPU preference enabled."
          Write-Host "[SUCCESS] WDDM driver enabled."
          Write-Host "[SUCCESS] H.264 hardware encoding preferred."
          Write-Host "[SUCCESS] AVC444 graphics mode preferred."

      # ==========================================
      # 3.2. VERIFY GPU CONFIGURATION
      # ==========================================
      - name: Verify Hardware Graphics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $registryPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          $policies = @(
              "bEnumerateHWBeforeSW",
              "fEnableWddmDriver",
              "AVCHardwareEncodePreferred",
              "AVC444ModePreferred"
          )

          foreach ($policy in $policies) {
              $value = Get-ItemPropertyValue `
                  -Path $registryPath `
                  -Name $policy

              if ($value -ne 1) {
                  throw "GPU policy verification failed: $policy"
              }

              Write-Host "[SUCCESS] $policy = $value"
          }

          Write-Host ""
          Write-Host "Detecting graphics adapters..."

          $adapters = Get-CimInstance Win32_VideoController

          $hardwareGPU = $false

          foreach ($adapter in $adapters) {
              Write-Host "--------------------------------"
              Write-Host "GPU          : $($adapter.Name)"
              Write-Host "Driver       : $($adapter.DriverVersion)"
              Write-Host "Video Proc.  : $($adapter.VideoProcessor)"
              Write-Host "Status       : $($adapter.Status)"

              if ($adapter.Name -match "NVIDIA|AMD|Radeon|Intel") {
                  $hardwareGPU = $true
              }
          }

          Write-Host "--------------------------------"

          if ($hardwareGPU) {
              Write-Host "[SUCCESS] Hardware GPU detected."
          } else {
              Write-Warning "No NVIDIA, AMD or Intel hardware GPU detected."
              Write-Warning "RDP will use the best available graphics adapter."
          }

          Write-Host "GPU policy verification completed."

      # ==========================================
      # 4. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale executable not found."
          }

          Start-Service -Name Tailscale

          Write-Host "Tailscale installed."

      # ==========================================
      # 5. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname = "reyette-rdp-${{ github.run_id }}"

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=$hostname" `
            "--accept-routes=false"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to connect to Tailscale."
          }

          $connected = $false
          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {
              $result = & $tailscale ip -4 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $ip = ($result | Select-Object -First 1).Trim()

                  if ($ip -match '^100\.') {
                      $connected = $true
                      break
                  }
              }

              Start-Sleep -Seconds 2
          }

          if (-not $connected) {
              throw "Unable to obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host "Tailscale connected."
          Write-Host "RDP IP: $ip"

      # ==========================================
      # 6. CONFIGURE FIREWALL
      # ==========================================
      - name: Configure RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Remove previous custom rule
          Get-NetFirewallRule `
            -DisplayName "Reyette RDP Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Disable standard broad RDP inbound rules
          Get-NetFirewallRule `
            -Name "RemoteDesktop-UserMode-In-TCP" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Get-NetFirewallRule `
            -Name "RemoteDesktop-UserMode-In-UDP" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Allow RDP only from Tailscale IPv4 range
          New-NetFirewallRule `
            -DisplayName "Reyette RDP Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "RDP firewall configured."

      # ==========================================
      # 7. SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 8. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ==========================================
      # 9. EXECUTE ROOT INSTALLER
      # ==========================================
      - name: Execute Repository Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:GITHUB_WORKSPACE

          $installer = Join-Path `
            $env:GITHUB_WORKSPACE `
            "install.ps1"

          if (-not (Test-Path $installer -PathType Leaf)) {
              throw "install.ps1 not found in repository root."
          }

          Write-Host "===================================="
          Write-Host "       REYETTE BOOTSTRAP"
          Write-Host "===================================="

          & $installer

          if (-not $?) {
              throw "Repository installer failed."
          }

          Write-Host "Repository installer completed."

      # ==========================================
      # 10. VERIFY RDP SERVICE
      # ==========================================
      - name: Verify RDP Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service -Name TermService

          if ($service.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP port 3389 is not listening."
          }

          # Verify Administrator membership
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          $adminMember = Get-LocalGroupMember -Group $adminGroup |
              Where-Object { $_.Name -match "\\RDP$" }

          if (-not $adminMember) {
              throw "RDP user is not an Administrator."
          }

          Write-Host "RDP service is ready."
          Write-Host "Administrator membership verified."

      # ==========================================
      # 11. DISPLAY CONNECTION INFORMATION
      # ==========================================
      - name: Display RDP Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "===================================="
          Write-Host "         REYETTE RDP READY"
          Write-Host "===================================="
          Write-Host ""
          Write-Host "Address       : $env:TAILSCALE_IP"
          Write-Host "Port          : 3389"
          Write-Host "Username      : RDP"
          Write-Host "Password      : GitHub Environment Secret"
          Write-Host "User Group    : Administrators"
          Write-Host "Graphics      : Hardware GPU Preferred"
          Write-Host "WDDM          : Enabled"
          Write-Host "AVC Encoding  : Hardware Preferred"
          Write-Host ""
          Write-Host "Connect using Windows Remote Desktop."
          Write-Host "===================================="

      # ==========================================
      # 12. KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep RDP Session Alive
        shell: pwsh
        run: |
          Write-Host "Reyette RDP is running."
          Write-Host "Session limit: 350 minutes."

          while ($true) {
              $service = Get-Service -Name TermService

              if ($service.Status -ne "Running") {
                  Start-Service -Name TermService
              }

              Start-Sleep -Seconds 60
          }
